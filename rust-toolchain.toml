# Stable, with the wasm target the in-page bundle and the extension core are
# built for (`cargo xtask bundle`). rustup installs both automatically on the
# first `cargo` invocation. See docs/ENGINE.md.
# Fork: pinned to the toolchain of the build image
# (rust:1.98-bookworm) instead of floating `stable`.
[toolchain]
channel = "1.98.1"
targets = ["wasm32-unknown-unknown"]
