# Builds the fork engine for linux-x64 and darwin-arm64, each twice on separate
# runners, compares the two sha256 values per platform and, when every pair is
# equal, publishes both binaries as one release with SHA256SUMS and a build
# provenance attestation, then lists the digests in every engine-checksums.txt
# on main. The launchers run only a binary whose digest is listed there, so a
# new upstream state yields a new, verifiable binary without a hand-edited
# checksum. A platform whose two builds differ blocks the whole release.
#
# Build a of linux-x64 also runs the workspace tests (cargo test, network none,
# same pinned image); a red test blocks the release like a digest difference.
# After the manifests commit, the package job packs the plugin of main with both
# binaries into impeccable-plugin.zip (tools/package-plugin.py, packed twice and
# compared) and adds it to the release. A marketplace pins that zip as an
# `archive` source (url plus sha256), so Claude Code installs plugin and engine in
# one verified step.
#
# The build recipes are tools/build-engine.sh (linux-x64: pinned image digest,
# fetch with network, build with --network none) and tools/build-engine-macos.sh
# (darwin-arm64: pinned toolchain, fetch with network, build inside a
# network-denying sandbox). Run them by hand to reproduce a release.
# tools/verify-launcher.sh runs the real launcher against every fresh build,
# good and tampered.
name: fork-engine

on:
  push:
    branches: [main]
    # Everything the engine binary is built from or embeds, and the recipe that
    # builds it. The checksum commit this workflow pushes touches
    # engine-checksums.txt alone, so it never starts another build. Keep in step
    # with `src` in the manifests job below.
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'ENGINE_VERSION'
      # include_str!/include_bytes! outside crates/ (crates/live/src/browser_assets.rs,
      # crates/comp-verbs, crates/context, crates/cli, crates/bundle, crates/skills,
      # crates/account).
      - 'skill/scripts/*.js'
      - 'ui/**'
      - 'browser-bundle/**'
      - 'scripts/bundle-signing-keys.json'
      - 'scripts/cli-pro-release-keys.json'
      - 'tools/build-engine.sh'
      - 'tools/build-engine-macos.sh'
      - '.github/workflows/fork-engine.yml'
      # Not part of the binary, but of the plugin zip: a change here needs a new zip.
      # They are left out of `src` in the manifests job on purpose (no stale digests).
      - 'plugin/**'
      - 'tools/package-plugin.py'
  workflow_dispatch:
  # For a later sync workflow that calls this one after it merged upstream.
  workflow_call:

permissions: {}

jobs:
  build:
    name: build ${{ matrix.platform }} (${{ matrix.build }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, darwin-arm64]
        build: [a, b]
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            script: tools/build-engine.sh
          # arm64 runner; the Xcode command line tools of the image are the one
          # thing the recipe cannot pin, see tools/build-engine-macos.sh.
          - platform: darwin-arm64
            runner: macos-15
            script: tools/build-engine-macos.sh
    env:
      ASSET: impeccable-${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the engine
        env:
          SCRIPT: ${{ matrix.script }}
          # A different output path per build: a path that leaks into the binary
          # shows up as a digest difference.
          OUT: ${{ runner.temp }}/out-${{ matrix.build }}
          # Workspace tests once per run, in the linux image without network.
          ENGINE_TEST: ${{ matrix.platform == 'linux-x64' && matrix.build == 'a' && '1' || '' }}
        run: sh "$SCRIPT" "$OUT"
      - name: Run the launcher against the build, good and tampered
        env:
          OUT: ${{ runner.temp }}/out-${{ matrix.build }}
        run: sh tools/verify-launcher.sh "$OUT/$ASSET"
      - name: Keep the binary and its digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.platform }}-${{ matrix.build }}
          path: |
            ${{ runner.temp }}/out-${{ matrix.build }}/${{ env.ASSET }}
            ${{ runner.temp }}/out-${{ matrix.build }}/${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 7

  compare:
    name: compare the builds
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      digest_linux_x64: ${{ steps.cmp.outputs.digest_linux_x64 }}
      digest_darwin_arm64: ${{ steps.cmp.outputs.digest_darwin_arm64 }}
      version: ${{ steps.cmp.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-*-?
          path: builds
      - name: Compare the sha256 values
        id: cmp
        run: |
          set -eu
          version=$(tr -d ' \t\r\n' < ENGINE_VERSION)
          [ -n "$version" ] || { echo "::error::ENGINE_VERSION is empty"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir verified
          {
            echo "### Engine build $version"
            echo "- source: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for platform in linux-x64 darwin-arm64; do
            asset=impeccable-$platform
            a=$(sha256sum "builds/engine-$platform-a/$asset" | cut -d' ' -f1)
            b=$(sha256sum "builds/engine-$platform-b/$asset" | cut -d' ' -f1)
            # The recorded digest must match the bytes as well, else the artifact changed in transit.
            [ "$a" = "$(cut -d' ' -f1 "builds/engine-$platform-a/$asset.sha256")" ] || { echo "$platform build a: recorded digest differs from the binary"; exit 1; }
            [ "$b" = "$(cut -d' ' -f1 "builds/engine-$platform-b/$asset.sha256")" ] || { echo "$platform build b: recorded digest differs from the binary"; exit 1; }
            echo "$platform build a: $a"
            echo "$platform build b: $b"
            [ -n "$a" ] && [ "$a" = "$b" ] || { echo "::error::the two $platform builds differ, nothing is published"; exit 1; }
            echo "digest_$(printf %s "$platform" | tr - _)=$a" >> "$GITHUB_OUTPUT"
            cp "builds/engine-$platform-a/$asset" "verified/$asset"
            {
              echo "- $platform build a: \`$a\`"
              echo "- $platform build b: \`$b\`"
              echo "- $platform result: equal"
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Keep the verified binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-verified
          path: verified/
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: compare
    # Only on main: a dispatch on another branch builds and compares, publishes nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      url: ${{ steps.rel.outputs.url }}
    steps:
      - name: Download the verified binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-verified
          path: dist
      - name: Create the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST_LINUX: ${{ needs.compare.outputs.digest_linux_x64 }}
          DIGEST_DARWIN: ${{ needs.compare.outputs.digest_darwin_arm64 }}
          VERSION: ${{ needs.compare.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          tag="engine-fork-$VERSION-$RUN_NUMBER"
          cd dist
          [ "$(sha256sum impeccable-linux-x64 | cut -d' ' -f1)" = "$DIGEST_LINUX" ] || { echo "::error::downloaded linux-x64 binary differs from the compared digest"; exit 1; }
          [ "$(sha256sum impeccable-darwin-arm64 | cut -d' ' -f1)" = "$DIGEST_DARWIN" ] || { echo "::error::downloaded darwin-arm64 binary differs from the compared digest"; exit 1; }
          sha256sum impeccable-linux-x64 impeccable-darwin-arm64 > SHA256SUMS
          cat > notes.md <<EOF
          Fork build of the impeccable engine $VERSION (linux-x64 and darwin-arm64), each built twice on separate runners with identical sha256.

          - source commit: \`$GITHUB_SHA\`
          - linux-x64 sha256: \`$DIGEST_LINUX\`
          - darwin-arm64 sha256: \`$DIGEST_DARWIN\`
          - recipes at that commit: \`sh tools/build-engine.sh <absolute outdir>\` (linux-x64, pinned rust image, build without network) and \`sh tools/build-engine-macos.sh <absolute outdir>\` (darwin-arm64, pinned toolchain, build in a network-denying sandbox)
          - provenance: \`gh attestation verify <asset> --repo $GH_REPO\`
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists (re-run): checking its assets instead of replacing them"
          else
            gh release create "$tag" impeccable-linux-x64 impeccable-darwin-arm64 SHA256SUMS --target "$GITHUB_SHA" \
              --title "Engine $VERSION (fork build $RUN_NUMBER)" --notes-file notes.md
          fi
          # Read the published assets back: they must be the compared bytes.
          mkdir ../readback
          gh release download "$tag" --dir ../readback --pattern 'impeccable-*' --pattern SHA256SUMS
          [ "$(sha256sum ../readback/impeccable-linux-x64 | cut -d' ' -f1)" = "$DIGEST_LINUX" ] || { echo "::error::the published linux-x64 asset differs from the compared digest"; exit 1; }
          [ "$(sha256sum ../readback/impeccable-darwin-arm64 | cut -d' ' -f1)" = "$DIGEST_DARWIN" ] || { echo "::error::the published darwin-arm64 asset differs from the compared digest"; exit 1; }
          (cd ../readback && sha256sum -c SHA256SUMS)
          url=$(gh release view "$tag" --json url --jq .url)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "- release: $url" >> "$GITHUB_STEP_SUMMARY"

  attest:
    name: build provenance
    needs: [compare, release]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the verified binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-verified
          path: dist
      - name: Check the bytes against the compared digests
        env:
          DIGEST_LINUX: ${{ needs.compare.outputs.digest_linux_x64 }}
          DIGEST_DARWIN: ${{ needs.compare.outputs.digest_darwin_arm64 }}
        run: |
          set -eu
          [ "$(sha256sum dist/impeccable-linux-x64 | cut -d' ' -f1)" = "$DIGEST_LINUX" ]
          [ "$(sha256sum dist/impeccable-darwin-arm64 | cut -d' ' -f1)" = "$DIGEST_DARWIN" ]
      - name: Attest the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/impeccable-linux-x64
            dist/impeccable-darwin-arm64

  manifests:
    name: list the digests in engine-checksums.txt
    needs: [compare, release, attest]
    # Only on main, like release and attest.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: fork-engine-manifests
      cancel-in-progress: false
    env:
      DIGEST_LINUX: ${{ needs.compare.outputs.digest_linux_x64 }}
      DIGEST_DARWIN: ${{ needs.compare.outputs.digest_darwin_arm64 }}
      VERSION: ${{ needs.compare.outputs.version }}
      BUILT_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Update every manifest copy and push
        run: |
          set -eu
          # The release the hosts download from must carry both listed assets.
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for a in impeccable-linux-x64 impeccable-darwin-arm64; do
            printf '%s\n' "$assets" | grep -qx "$a" || { echo "::error::release $RELEASE_TAG does not carry $a"; exit 1; }
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Files whose change makes the built binaries stale (the build recipes included).
          src='crates Cargo.toml Cargo.lock rust-toolchain.toml .cargo ENGINE_VERSION skill/scripts/live-browser-session.js skill/scripts/live-browser-dom.js skill/scripts/live-browser-ignores.js skill/scripts/live-browser.js skill/scripts/modern-screenshot.umd.js ui browser-bundle scripts/bundle-signing-keys.json scripts/cli-pro-release-keys.json tools/build-engine.sh tools/build-engine-macos.sh .github/workflows/fork-engine.yml'
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            # shellcheck disable=SC2086
            if ! git diff --quiet "$BUILT_SHA" HEAD -- $src; then
              echo "main moved on in the engine source since $BUILT_SHA: these digests are stale, a newer build lists its own."
              exit 0
            fi
            master=skill/scripts/engine-checksums.txt
            cp "$master" "$RUNNER_TEMP/manifest"
            changed=0
            for entry in "impeccable-linux-x64 $DIGEST_LINUX" "impeccable-darwin-arm64 $DIGEST_DARWIN"; do
              asset=${entry% *}
              digest=${entry#* }
              if grep -qx "$VERSION $asset $digest" "$RUNNER_TEMP/manifest"; then
                echo "engine-checksums.txt already lists $VERSION $asset $digest"
                continue
              fi
              # Replace the line for this version and asset, keep comments and other lines.
              { grep -vE "^$VERSION[[:space:]]+$asset[[:space:]]" "$RUNNER_TEMP/manifest" || true; echo "$VERSION $asset $digest"; } > "$RUNNER_TEMP/manifest.new"
              mv "$RUNNER_TEMP/manifest.new" "$RUNNER_TEMP/manifest"
              changed=1
            done
            [ "$changed" = 1 ] || exit 0
            # engine-release.txt: the one release tag that carries the listed assets.
            printf '%s\n' "$RELEASE_TAG" > "$RUNNER_TEMP/release"
            find . -name engine-checksums.txt -not -path './.git/*' -not -path '*/node_modules/*' -not -path './target/*' |
              while read -r f; do
                cp "$RUNNER_TEMP/manifest" "$f"
                cp "$RUNNER_TEMP/release" "$(dirname "$f")/engine-release.txt"
              done
            sh tools/fork-guard.sh
            git add -u
            git ls-files --others --exclude-standard -- '*/engine-release.txt' | while read -r f; do git add -- "$f"; done
            git commit --quiet -m "chore(engine): list the reproducible builds of $(printf %s "$DIGEST_LINUX" | cut -c1-12) (linux-x64) and $(printf %s "$DIGEST_DARWIN" | cut -c1-12) (darwin-arm64)"
            if git push origin HEAD:main; then
              break
            fi
            [ "$attempt" -lt 4 ] || { echo "::error::push to main kept failing"; exit 1; }
            echo "push rejected (main moved), retrying"
            sleep 5
          done
          echo "- manifests: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: plugin zip
    needs: [compare, release, manifests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      commit: ${{ steps.pack.outputs.commit }}
      zip_sha256: ${{ steps.pack.outputs.zip_sha256 }}
    env:
      DIGEST_LINUX: ${{ needs.compare.outputs.digest_linux_x64 }}
      DIGEST_DARWIN: ${{ needs.compare.outputs.digest_darwin_arm64 }}
      BUILT_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download the verified binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-verified
          path: ${{ runner.temp }}/engine
      - name: Pack the plugin twice, compare, publish
        id: pack
        run: |
          set -eu
          e="$RUNNER_TEMP/engine"
          [ "$(sha256sum "$e/impeccable-linux-x64" | cut -d' ' -f1)" = "$DIGEST_LINUX" ]
          [ "$(sha256sum "$e/impeccable-darwin-arm64" | cut -d' ' -f1)" = "$DIGEST_DARWIN" ]
          # Same staleness rule as the manifests job: a newer engine source on main packs its own zip.
          src='crates Cargo.toml Cargo.lock rust-toolchain.toml .cargo ENGINE_VERSION skill/scripts/live-browser-session.js skill/scripts/live-browser-dom.js skill/scripts/live-browser-ignores.js skill/scripts/live-browser.js skill/scripts/modern-screenshot.umd.js ui browser-bundle scripts/bundle-signing-keys.json scripts/cli-pro-release-keys.json tools/build-engine.sh tools/build-engine-macos.sh .github/workflows/fork-engine.yml'
          # shellcheck disable=SC2086
          if ! git diff --quiet "$BUILT_SHA" HEAD -- $src; then
            echo "main moved on in the engine source since $BUILT_SHA: no zip from these binaries."
            exit 0
          fi
          commit=$(git rev-parse HEAD)
          # Two packs from two separate copies of plugin/ must give the same bytes.
          mkdir "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          git archive "$commit" plugin | tar -x -C "$RUNNER_TEMP/a"
          git archive "$commit" plugin | tar -x -C "$RUNNER_TEMP/b"
          python3 -I tools/package-plugin.py "$RUNNER_TEMP/a/plugin" "$e/impeccable-linux-x64" "$e/impeccable-darwin-arm64" "$RUNNER_TEMP/a.zip"
          python3 -I tools/package-plugin.py "$RUNNER_TEMP/b/plugin" "$e/impeccable-linux-x64" "$e/impeccable-darwin-arm64" "$RUNNER_TEMP/b.zip"
          cmp "$RUNNER_TEMP/a.zip" "$RUNNER_TEMP/b.zip" || { echo "::error::the two plugin zips differ"; exit 1; }
          mkdir dist
          cp "$RUNNER_TEMP/a.zip" dist/impeccable-plugin.zip
          zsha=$(sha256sum dist/impeccable-plugin.zip | cut -d' ' -f1)
          (cd dist && sha256sum impeccable-plugin.zip > impeccable-plugin.zip.sha256)
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx impeccable-plugin.zip; then
            echo "release $RELEASE_TAG already carries impeccable-plugin.zip (re-run): checking it instead of replacing it"
          else
            gh release upload "$RELEASE_TAG" dist/impeccable-plugin.zip dist/impeccable-plugin.zip.sha256
          fi
          mkdir "$RUNNER_TEMP/readback"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/readback" --pattern impeccable-plugin.zip
          [ "$(sha256sum "$RUNNER_TEMP/readback/impeccable-plugin.zip" | cut -d' ' -f1)" = "$zsha" ] || { echo "::error::the published plugin zip differs from the packed one"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$zsha" >> "$GITHUB_OUTPUT"
          {
            echo "- plugin zip: \`impeccable-plugin.zip\` from \`$commit\`, sha256 \`$zsha\`"
            echo "- marketplace source: \`{\"source\": \"archive\", \"url\": \"https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/impeccable-plugin.zip\", \"sha256\": \"$zsha\"}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the plugin zip
        if: steps.pack.outputs.zip_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/impeccable-plugin.zip

  listed-check:
    name: launcher with the listed digest (${{ matrix.platform }})
    needs: manifests
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: darwin-arm64
            runner: macos-15
    steps:
      - name: Checkout main as listed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Download the published binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # Exactly the tag the hosts will use, read from main, not the one of this run.
          tag=$(cat plugin/skills/impeccable/scripts/engine-release.txt)
          echo "release tag from engine-release.txt: $tag"
          gh release download "$tag" --dir "$RUNNER_TEMP/published" --pattern "impeccable-${{ matrix.platform }}"
      - name: Run the launcher with the checksums of main, good and tampered
        run: >-
          sh tools/verify-launcher.sh
          "$RUNNER_TEMP/published/impeccable-${{ matrix.platform }}"
          plugin/skills/impeccable/scripts/engine-checksums.txt
