# Builds the fork engine (linux-x64) twice on separate runners, compares the two
# sha256 values and, when they are equal, publishes the binary as a release with
# SHA256SUMS and a build provenance attestation, then lists the digest in every
# engine-checksums.txt on main. The launchers run only a binary whose digest is
# listed there, so a new upstream state yields a new, verifiable binary without
# a hand-edited checksum.
#
# The build recipe is tools/build-engine.sh (pinned image digest, fetch with
# network, build with --network none). Run it by hand to reproduce a release.
name: fork-engine

on:
  push:
    branches: [main]
    # Source of the engine only. The checksum commit this workflow pushes touches
    # engine-checksums.txt alone, so it never starts another build.
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'ENGINE_VERSION'
  workflow_dispatch:
  # For a later sync workflow that calls this one after it merged upstream.
  workflow_call:

permissions: {}

env:
  ASSET: impeccable-linux-x64

jobs:
  build:
    name: build (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build: [a, b]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the engine
        run: sh tools/build-engine.sh "$RUNNER_TEMP/out"
      - name: Keep the binary and its digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.build }}
          path: |
            ${{ runner.temp }}/out/${{ env.ASSET }}
            ${{ runner.temp }}/out/${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 7

  compare:
    name: compare the two builds
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.cmp.outputs.digest }}
      version: ${{ steps.cmp.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download both builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-*
          path: builds
      - name: Compare the sha256 values
        id: cmp
        run: |
          set -eu
          a=$(sha256sum "builds/engine-a/$ASSET" | cut -d' ' -f1)
          b=$(sha256sum "builds/engine-b/$ASSET" | cut -d' ' -f1)
          # The recorded digest must match the bytes as well, else the artifact changed in transit.
          [ "$a" = "$(cut -d' ' -f1 "builds/engine-a/$ASSET.sha256")" ] || { echo "build a: recorded digest differs from the binary"; exit 1; }
          [ "$b" = "$(cut -d' ' -f1 "builds/engine-b/$ASSET.sha256")" ] || { echo "build b: recorded digest differs from the binary"; exit 1; }
          echo "build a: $a"
          echo "build b: $b"
          [ -n "$a" ] && [ "$a" = "$b" ] || { echo "::error::the two builds differ, nothing is published"; exit 1; }
          version=$(tr -d ' \t\r\n' < ENGINE_VERSION)
          [ -n "$version" ] || { echo "::error::ENGINE_VERSION is empty"; exit 1; }
          echo "digest=$a" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### Engine build $version"
            echo "- source: \`$GITHUB_SHA\`"
            echo "- build a: \`$a\`"
            echo "- build b: \`$b\`"
            echo "- result: equal"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the verified binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-verified
          path: builds/engine-a/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      url: ${{ steps.rel.outputs.url }}
    steps:
      - name: Download the verified binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-verified
          path: dist
      - name: Create the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ needs.compare.outputs.digest }}
          VERSION: ${{ needs.compare.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          tag="engine-fork-$VERSION-$RUN_NUMBER"
          cd dist
          [ "$(sha256sum "$ASSET" | cut -d' ' -f1)" = "$DIGEST" ] || { echo "::error::downloaded binary differs from the compared digest"; exit 1; }
          sha256sum "$ASSET" > SHA256SUMS
          cat > notes.md <<EOF
          Fork build of the impeccable engine $VERSION (linux-x64), built twice on separate runners with identical sha256.

          - source commit: \`$GITHUB_SHA\`
          - sha256: \`$DIGEST\`
          - recipe: \`sh tools/build-engine.sh <absolute outdir>\` at that commit (pinned rust image, build without network)
          - provenance: \`gh attestation verify $ASSET --repo $GH_REPO\`
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists (re-run): checking its asset instead of replacing it"
          else
            gh release create "$tag" "$ASSET" SHA256SUMS --target "$GITHUB_SHA" \
              --title "Engine $VERSION (fork build $RUN_NUMBER)" --notes-file notes.md
          fi
          # Read the published asset back: it must be the compared bytes.
          mkdir ../readback
          gh release download "$tag" --dir ../readback --pattern "$ASSET" --pattern SHA256SUMS
          [ "$(sha256sum "../readback/$ASSET" | cut -d' ' -f1)" = "$DIGEST" ] || { echo "::error::the published asset differs from the compared digest"; exit 1; }
          (cd ../readback && sha256sum -c SHA256SUMS)
          url=$(gh release view "$tag" --json url --jq .url)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "- release: $url" >> "$GITHUB_STEP_SUMMARY"

  attest:
    name: build provenance
    needs: [compare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the verified binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-verified
          path: dist
      - name: Check the bytes against the compared digest
        env:
          DIGEST: ${{ needs.compare.outputs.digest }}
        run: |
          [ "$(sha256sum "dist/$ASSET" | cut -d' ' -f1)" = "$DIGEST" ]
      - name: Attest the binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.ASSET }}

  manifests:
    name: list the digest in engine-checksums.txt
    needs: [compare, release, attest]
    # Only on main: a dispatch on another branch publishes a release but lists nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: fork-engine-manifests
      cancel-in-progress: false
    env:
      DIGEST: ${{ needs.compare.outputs.digest }}
      VERSION: ${{ needs.compare.outputs.version }}
      BUILT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Update every manifest copy and push
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Files whose change makes the built binary stale (the build recipe included).
          src='crates Cargo.toml Cargo.lock rust-toolchain.toml ENGINE_VERSION tools/build-engine.sh'
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            # shellcheck disable=SC2086
            if ! git diff --quiet "$BUILT_SHA" HEAD -- $src; then
              echo "main moved on in the engine source since $BUILT_SHA: this digest is stale, a newer build lists its own."
              exit 0
            fi
            master=skill/scripts/engine-checksums.txt
            if grep -qx "$VERSION $ASSET $DIGEST" "$master"; then
              echo "engine-checksums.txt already lists $VERSION $ASSET $DIGEST"
              exit 0
            fi
            # Replace the line for this version and asset, keep comments and other lines.
            { grep -vE "^$VERSION[[:space:]]+$ASSET[[:space:]]" "$master" || true; echo "$VERSION $ASSET $DIGEST"; } > "$RUNNER_TEMP/manifest"
            find . -name engine-checksums.txt -not -path './.git/*' -not -path '*/node_modules/*' -not -path './target/*' |
              while read -r f; do cp "$RUNNER_TEMP/manifest" "$f"; done
            sh tools/fork-guard.sh
            git add -u
            git commit --quiet -m "chore(engine): list the reproducible build of $(printf %s "$DIGEST" | cut -c1-12)"
            if git push origin HEAD:main; then
              break
            fi
            [ "$attempt" -lt 4 ] || { echo "::error::push to main kept failing"; exit 1; }
            echo "push rejected (main moved), retrying"
            sleep 5
          done
          echo "- manifests: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
